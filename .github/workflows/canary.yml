name: canary

on:
  schedule:
    - cron: "23 6 * * *"   # once daily; avoid :00 so it doesn't pile up with everyone else's
  workflow_dispatch: {}     # dispatch manually at least once before trusting the badge

jobs:
  # Unlike stockx-scraper's canary — which skips by default because a live
  # test already found that a plain connection AND a residential proxy
  # both get the same Cloudflare block on that site, and only the Scraping
  # Browser API has ever gotten through — NO equivalent live measurement
  # exists for skyscanner.com (see flight_parser.py's module docstring:
  # WebFetch on this site is robots.txt-restricted, and that restriction
  # was not bypassed to build this repo). So this job runs the LOCAL-FIRST
  # default with no secrets at all, on a schedule, as this codebase's
  # actual first live test against the real site. A failure here is
  # informative, not necessarily a regression — see the assertion step
  # below for exactly which outcomes count as a real bug vs. "the
  # selectors need updating for the current markup."
  canary-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Run the local-first default against a real route, 30 days out
        run: |
          DEPART_DATE=$(date -u -d "+30 days" +%Y-%m-%d)
          echo "depart-date=$DEPART_DATE" >> "$GITHUB_ENV"
          set +e
          python3 playwright_scraper.py \
            --origin LHR --destination JFK --depart-date "$DEPART_DATE" \
            --max-results 10 --format json --out canary_out.json --dump-html
          echo "exit_code=$?" >> "$GITHUB_ENV"

      - name: Interpret the exit code — only a crash/bad-usage is a real CI failure
        run: |
          python3 -c "
          import json, os, sys

          code = int(os.environ['exit_code'])
          print(f'playwright_scraper.py exited {code}')

          # EXIT_OK=0 / EXIT_PARTIAL=6: a real, trustworthy run — report it.
          if os.path.exists('canary_out.json.meta.json'):
              meta = json.load(open('canary_out.json.meta.json'))
              print(json.dumps(meta, indent=2))
              print(f\"canary: got {meta['product_count']} itineraries via engine={meta['engine']}\")

          # EXIT_BLOCKED=3 / EXIT_ZERO_PRODUCTS=4 / EXIT_REMOTE_API_ERROR=5:
          # finish_run() writes NO sidecar for any of these by design (a
          # stale 'failed' sidecar must never sit beside a previous good
          # output). Since flight_parser.py's selectors are best-effort
          # guesses never checked against a live response (see its module
          # docstring), a 3/4/5 here most likely means 'the real markup
          # doesn't match the guess yet' — worth investigating, not a
          # broken build. Report it as a notice, not a failure.
          elif code in (3, 4, 5):
              print(f'::notice::exit {code} — no sidecar written (blocked/empty/remote-api-error, '
                    f'by finish_run design). flight_parser.py selectors may need updating for the '
                    f'current skyscanner.com markup — inspect canary_out_debug.html from this run\\'s '
                    f'uploaded artifact.')

          # EXIT_CRASH=1 / EXIT_BAD_USAGE=2: an unhandled exception or a
          # usage bug in THIS repo's own code, independent of what the
          # live site returned — this is a real failure.
          elif code in (1, 2):
              print(f'::error::exit {code} is a crash/bad-usage outcome — a real bug in this '
                    f'repo\\'s own code, not a live-site surprise. See the previous step\\'s log.')
              sys.exit(1)

          else:
              print(f'::error::unrecognised exit code {code}')
              sys.exit(1)
          "

      - name: Upload artifacts (output + debug HTML) on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-local-${{ github.run_id }}
          path: |
            canary_out.json
            canary_out.json.meta.json
            canary_out_debug.html
          retention-days: 14

  # Opt-in, mirroring stockx-scraper's pattern: exercises the --cdp-endpoint
  # (2Captcha Scraping Browser API) path when a repo secret is configured.
  # Skips cleanly — not red — when it isn't, same reasoning as
  # stockx-scraper's canary.yml.
  canary-cdp:
    runs-on: ubuntu-latest
    env:
      HAS_CDP: ${{ secrets.SKYSCANNER_CDP_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip — no SKYSCANNER_CDP_ENDPOINT secret configured
        if: env.HAS_CDP != 'true'
        run: |
          echo "::notice::Skipping the Scraping Browser API run: no SKYSCANNER_CDP_ENDPOINT \
          secret is set. This is optional — canary-local above already exercises this repo's \
          local-first default with no secrets at all. Set SKYSCANNER_CDP_ENDPOINT (and \
          TWOCAPTCHA_KEY) as repo secrets to also turn this job on. This is a SKIP, not a pass \
          or a fail."

      - uses: actions/setup-python@v5
        if: env.HAS_CDP == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements-playwright.txt
        if: env.HAS_CDP == 'true'

      # Both secrets go through the ENVIRONMENT, never a command-line flag
      # (credentials never reach argv). env_config.py already reads
      # SKYSCANNER_CDP_ENDPOINT/TWOCAPTCHA_KEY unconditionally, so this is
      # correct with or without either secret set.
      - name: Run over the Scraping Browser API
        if: env.HAS_CDP == 'true'
        env:
          SKYSCANNER_CDP_ENDPOINT: ${{ secrets.SKYSCANNER_CDP_ENDPOINT }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          DEPART_DATE=$(date -u -d "+30 days" +%Y-%m-%d)
          python3 playwright_scraper.py \
            --origin LHR --destination JFK --depart-date "$DEPART_DATE" \
            --max-results 10 --format json --out canary_cdp_out.json --dump-html

      - name: Upload artifacts on every non-skipped run
        if: always() && env.HAS_CDP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-cdp-${{ github.run_id }}
          path: |
            canary_cdp_out.json
            canary_cdp_out.json.meta.json
            canary_cdp_out_debug.html
          retention-days: 14
