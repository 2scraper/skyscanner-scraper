name: canary

on:
  schedule:
    - cron: "23 6 * * *"   # once daily; avoid :00 so it doesn't pile up with everyone else's
  workflow_dispatch: {}     # dispatch manually at least once (from the default branch) before trusting the badge

# What is measured (README "Read this before trusting a run"): every fully
# automated run against skyscanner.com so far — local Chromium, the Scraping
# Browser API over --cdp-endpoint, --cookies-file — was challenged by
# PerimeterX. A GitHub runner is a datacentre address, so an ungated live run
# here cannot pass, and a check that is red every day teaches everyone to
# ignore it (CLAUDE.md §11: a canary that cannot pass must SKIP, not fail).
# So each live job runs only when its secret is configured, and then ASSERTS
# (status, a floor, price and currency coverage, the XHR source). Without the
# secret it goes green with a ::notice:: saying it skipped.

jobs:
  canary-proxy:
    name: canary (local Chromium via SKYSCANNER_PROXY)
    runs-on: ubuntu-latest
    env:
      HAS_PROXY: ${{ secrets.SKYSCANNER_PROXY != '' }}
    steps:
      - name: Skip — no SKYSCANNER_PROXY secret
        if: env.HAS_PROXY != 'true'
        run: |
          echo "::notice::SKIPPED, not passed: no SKYSCANNER_PROXY secret. From a datacentre runner \
          every measured run was challenged by PerimeterX, so an ungated run here cannot pass. Set a \
          residential SKYSCANNER_PROXY secret to turn this job on."
      - uses: actions/checkout@v4
        if: env.HAS_PROXY == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_PROXY == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: env.HAS_PROXY == 'true'
        run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium
      # The credential goes through the ENVIRONMENT, never argv (§3/§11):
      # env_config.py reads SKYSCANNER_PROXY itself.
      - name: Run a real route, 30 days out
        if: env.HAS_PROXY == 'true'
        env:
          SKYSCANNER_PROXY: ${{ secrets.SKYSCANNER_PROXY }}
        run: |
          set +e
          python3 playwright_scraper.py --origin LHR --destination JFK \
            --depart-date "$(date -u -d '+30 days' +%Y-%m-%d)" \
            --max-results 1000 --format json --out canary_out.json --dump-html
          echo "exit_code=$?" >> "$GITHUB_ENV"
      - name: Assert the run
        if: env.HAS_PROXY == 'true'
        run: python3 .github/canary_assert.py canary_out.json "$exit_code"
      - name: Upload artefacts
        if: always() && env.HAS_PROXY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-proxy-${{ github.run_id }}
          path: |
            canary_out.json
            canary_out.json.meta.json
            canary_out_debug.html
            canary_out_search_api_debug.json
          retention-days: 14

  canary-cdp:
    name: canary (Scraping Browser API via SKYSCANNER_CDP_ENDPOINT)
    runs-on: ubuntu-latest
    env:
      HAS_CDP: ${{ secrets.SKYSCANNER_CDP_ENDPOINT != '' }}
    steps:
      - name: Skip — no SKYSCANNER_CDP_ENDPOINT secret
        if: env.HAS_CDP != 'true'
        run: |
          echo "::notice::SKIPPED, not passed: no SKYSCANNER_CDP_ENDPOINT secret. Measured \
          2026-09-20..29: every Scraping Browser session was challenged by PerimeterX on this site, \
          so expect this job to fail with exit 3 if you turn it on; it exists to notice if that changes."
      - uses: actions/checkout@v4
        if: env.HAS_CDP == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_CDP == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements-playwright.txt
        if: env.HAS_CDP == 'true'
      - name: Run over the Scraping Browser API
        if: env.HAS_CDP == 'true'
        env:
          SKYSCANNER_CDP_ENDPOINT: ${{ secrets.SKYSCANNER_CDP_ENDPOINT }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          set +e
          python3 playwright_scraper.py --origin LHR --destination JFK \
            --depart-date "$(date -u -d '+30 days' +%Y-%m-%d)" \
            --max-results 1000 --format json --out canary_cdp_out.json --dump-html
          echo "exit_code=$?" >> "$GITHUB_ENV"
      - name: Assert the run
        if: env.HAS_CDP == 'true'
        run: python3 .github/canary_assert.py canary_cdp_out.json "$exit_code"
      - name: Upload artefacts
        if: always() && env.HAS_CDP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-cdp-${{ github.run_id }}
          path: |
            canary_cdp_out.json
            canary_cdp_out.json.meta.json
            canary_cdp_out_debug.html
            canary_cdp_out_search_api_debug.json
          retention-days: 14
